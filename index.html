<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reckless Abandon</title>
  <link href="styles.css" rel="stylesheet">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>

<body>
  <nav>
    <ul>
      <li><a href="https://newmediartspace.info">New Media Artspace</a></li>
    </ul>
  </nav>

  <h1 class="sr-only spray">Reckless Abandon</h1>
  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <defs>
      <filter id="spray-life" x="-5%" y="-5%" width="125%" height="125%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.12 0.15" numOctaves="3" result="noise" />
        <feDisplacementMap id="disp" in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R"
          yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <div class="scene" id="scene">
    <div class="shelf" id="shelf"></div>
  </div>
  <canvas id="erase-canvas" aria-hidden="true" role="presentation">
  </canvas>
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <div class="modal">
      <div class="modal-top">
        <button id="close-btn" class="close-btn" aria-label="Close modal">Reckless Abandon</button>
        <h2 id="modal-title">Project Title</h2>
        <div id="proj-artist"></div>
        <div id="proj-info"></div>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="curatorial-panel" class="modal hidden" role="complementary" aria-modal="true" aria-label="Curatorial Statement">
    <div class="curatorial-content">
      <button id="curatorial-close-btn" class="close-btn" aria-label="Close panel">Reckless Abandon</button>

      <h2>Curatorial Statement</h2>
      <p>
        Text
      </p>
      <h3>Credits</h3>
      <p>8 Ball Model: <a href="https://skfb.ly/6qvFO">8ball</a> by jtherussian is licensed under <a
          href="http://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution</a>.</p>
    </div>
  </div>
  <div id="eight-ball-overlay" class="hidden" role="complementary" aria-modal="true"
    aria-labelledby="eight-ball-heading">
    <button id="eight-ball-close" class="close-btn" aria-label="Close selector">Reckless Abandon</button>

    <div class="eight-ball-container">
      <!--<h2 id="eight-ball-heading">Shake with <span class="bottom-text">Reckless Abandon</span></h2>-->

      <div id="overlay-eight-ball" class="oracle-sphere">
        <div class="oracle-window">
          <div id="oracle-answer" class="oracle-text">CLICK<br>TO SHAKE</div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>

</body>

</html>
