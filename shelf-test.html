<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Shelf - Glass Texture Reveal</title>
  <style>
    @font-face {
      font-family: 'Rubik Spray Paint';
      src: url('fonts/RubikSprayPaint-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Rosario';
      src: url('fonts/Rosario-Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Rosario';
      src: url('fonts/Rosario-LightItalic.woff2') format('woff2');
      font-weight: 300;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: 'Rosario';
      src: url('fonts/Rosario-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Rosario';
      src: url('fonts/Rosario-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: 'Rosario';
      src: url('fonts/Rosario-SemiBoldItalic.woff2') format('woff2');
      font-weight: 600;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: 'Rosario';
      src: url('fonts/Rosario-Italic.woff2') format('woff2');
      font-weight: normal;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
    font-family: 'Rosario';
    src: url('Rosario-Bold.woff2') format('woff2');
    font-weight: bold;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: 'Rosario';
    src: url('Rosario-BoldItalic.woff2') format('woff2');
    font-weight: bold;
    font-style: italic;
    font-display: swap;
}



    :root {
      --cols: 4;
      --rows: 4;
      --cube-size: min(calc(100vw / var(--cols)), calc(100vh / var(--rows)));
      --half-size: calc(var(--cube-size) / 2);
      --rim-thickness: calc(var(--cube-size) * 0.06);
      --track-size: calc(var(--cube-size) - var(--rim-thickness));

      --shelf-base: #bbb4ae;
      --shelf-back: #f3efe6;
      --shelf-floor: #dfdbd3;
      --shelf-wall-left: #faf7e8;
      --shelf-wall-right: #ebe6dc;
      --rim-color: #fffdf5;
      --border-color: rgba(0, 0, 0, 0);

      --base-font: 'Rosario', sans-serif;
      --title-font: 'Rubik Spray Paint', sans-serif;

      --blue: #0375d8;
      --pink: #e7378c;
      --gold: #f18b39;
      --red: #eb3c2b;
      --yellow: #fef73c;
    }

    @media (max-width: 600px) {
      :root {
        --cols: 3;
        --rows: 6;
      }

      .shelf .cubby:last-child {
        grid-column: 1 / -1;
        width: calc(100% + var(--rim-thickness));
        height: var(--cube-size);
      }

      .shelf .cubby:last-child .top,
      .shelf .cubby:last-child .bottom {
        height: var(--cube-size) !important;
        width: 100%;
      }

      .shelf .cubby:last-child .left,
      .shelf .cubby:last-child .right {
        width: var(--cube-size) !important;
        height: 100%;
      }

      .shelf .cubby:last-child .right {
        right: 0;
        left: auto;
        transform-origin: right;
        transform: rotateY(90deg) translateX(50%);
      }

      .shelf .cubby:last-child .front,
      .shelf .cubby:last-child .back {
        width: 100%;
        height: 100%;
      }
    }

    body,
    html {
      margin: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      background-color: #000000;
      perspective: calc(var(--cube-size) * 12);
      overflow: hidden;
      font-family: var(--base-font);
    }

    h1 {
      font-family: var(--title-font);
    }

    /* The Overlay Canvas */
    #erase-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: crosshair;
      touch-action: none;
    }

    .scene {
      width: calc(var(--track-size) * var(--cols));
      height: calc(var(--track-size) * var(--rows));
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      z-index: 1;
    }

    .shelf {
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--track-size));
      grid-template-rows: repeat(var(--rows), var(--track-size));
      transform-style: preserve-3d;
      margin-top: 2em;
    }

    .cubby {
      position: relative;
      width: var(--cube-size);
      height: var(--cube-size);
      transform-style: preserve-3d;
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
    }

    .back {
      transform: translateZ(calc(var(--half-size) * -1));
      background-color: var(--shelf-back);
    }

    .top {
      transform: rotateX(90deg) translateZ(var(--half-size));
      background-color: var(--shelf-base);
    }

    .bottom {
      transform: rotateX(-90deg) translateZ(var(--half-size));
      background-color: var(--shelf-floor);
    }

    .left {
      transform: rotateY(-90deg) translateZ(var(--half-size));
      background-color: var(--shelf-wall-left);
    }

    .right {
      transform: rotateY(90deg) translateZ(var(--half-size));
      background-color: var(--shelf-wall-right);
    }

    .front {
      transform: translateZ(var(--half-size));
      background: none;
      border: var(--rim-thickness) solid var(--rim-color);
      pointer-events: none;
    }

    .content {
      position: absolute;
      width: 60%;
      height: 60%;
      top: 20%;
      left: 20%;
      transform: translateZ(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgb(0, 0, 0);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      font-size: calc(var(--cube-size) * 0.12);
      font-family: system-ui, sans-serif;
    }

    /* Magic 8 Ball Container */
    .magic-8-ball {
      width: 80%;
      height: 80%;
      background: radial-gradient(circle at 30% 30%, #444, #000);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease;
      animation: float 3s ease-in-out infinite;
    }

    .magic-8-ball:active {
      transform: scale(0.9) rotate(10deg);
    }

    /* The white circle / blue window */
    .ball-window {
      width: 45%;
      height: 45%;
      background: #111;
      border: 4px solid #222;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #55aaff;
      font-family: 'Georgia', serif;
      font-size: 0.4em;
      /* Relative to cubby size */
      padding: 5px;
      overflow: hidden;
      text-shadow: 0 0 5px #55aaff;
    }

    /* The number 8 (visible initially) */
    .number-8 {
      font-size: 2em;
      color: white;
      font-family: sans-serif;
      font-weight: bold;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    nav {
      position: absolute;
      z-index: 100;
      width: 100%;
      box-sizing: border-box;
    }

    nav ul {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      flex-wrap: wrap;
      width: 100%;
      padding: 0;
    }

    nav ul li::marker {
      content: none;
    }

    nav a {
      text-transform: uppercase;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: 0.04em;
      padding: 1em;
    }

    nav ul li a {
      color: var(--blue);

    }

    nav ul li:nth-of-type(1) a {
      color: var(--pink);
    }
  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="https://newmediartspace.info">New Media Artspace</a></li>
      <li><a href="curatorial-statement.html">Curatorial Statement</a></li>
    </ul>
  </nav>
  <canvas id="erase-canvas">
  </canvas>
  <h1 class="sr-only">Reckless Abandon</h1>

  <div class="scene" id="scene">
    <div class="shelf" id="shelf"></div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const TEXTURE_URL = 'Texturelabs_Glass_135St.png';
    const ERASE_SIZE = 100;

    // -- 1. Populate Shelf --
    const answers = [
      "IT IS\nCERTAIN", "DECIDEDLY\nSO", "WITHOUT\nA DOUBT",
      "YES\nDEFINITELY", "YOU MAY\nRELY ON IT", "AS I\nSEE IT, YES",
      "MOST\nLIKELY", "OUTLOOK\nGOOD", "YES", "SIGNS POINT\nTO YES",
      "REPLY HAZY\nTRY AGAIN", "ASK AGAIN\nLATER", "BETTER NOT\nTELL YOU",
      "CANNOT\nPREDICT", "CONCENTRATE\nAND ASK", "DON'T\nCOUNT ON IT",
      "MY REPLY\nIS NO", "MY SOURCES\nSAY NO", "OUTLOOK\nNOT SO GOOD",
      "VERY\nDOUBTFUL"
    ];

    const shelf = document.getElementById('shelf');

    for (let i = 0; i < 16; i++) {
      const cubby = document.createElement('div');
      cubby.className = 'cubby';

      // Base faces
      let contentHtml = `<div class="face back"></div><div class="face top"></div><div class="face bottom"></div><div class="face left"></div><div class="face right"></div><div class="face front"></div>`;

      if (i === 15) {
        // Inject the Magic 8 Ball into the last cubby
        cubby.innerHTML = contentHtml + `
      <div class="content" style="background:none; box-shadow:none;">
        <div class="magic-8-ball" id="eight-ball">
          <div class="ball-window" id="ball-answer">
            <span class="number-8">8</span>
          </div>
        </div>
      </div>`;
      } else {
        // Normal content for other cubbies
        cubby.innerHTML = contentHtml + `<div class="content">${i + 1}</div>`;
      }

      shelf.appendChild(cubby);
    }

    // Logic for clicking the 8 ball
    const ball = document.getElementById('eight-ball');
    const display = document.getElementById('ball-answer');

    if (ball) {
      ball.addEventListener('click', () => {
        // Shake effect (CSS class could be added here)
        display.style.opacity = '0';

        setTimeout(() => {
          const randomAnswer = answers[Math.floor(Math.random() * answers.length)];
          display.innerHTML = randomAnswer.replace('\n', '<br>');
          display.style.opacity = '1';
        }, 300);
      });
    }

    // -- 2. Canvas Setup --
    const canvas = document.getElementById('erase-canvas');
    const ctx = canvas.getContext('2d');
    const textureImg = new Image();
    textureImg.src = TEXTURE_URL;
    textureImg.crossOrigin = "anonymous";

    function initCtx() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // 1. Draw the "Glass" Background
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(255,255, 255, 0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Draw the Texture Pattern
      if (textureImg.complete) {
        const pattern = ctx.createPattern(textureImg, 'repeat');
        if (pattern) {
          ctx.fillStyle = pattern;
          ctx.globalAlpha = 0.25;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      // 3. Draw the ERASEABLE TITLE
      ctx.globalAlpha = 1.0;
      ctx.fillStyle = "black";
      // Responsive font size: 8% of the window width
      const fontSize = Math.max(60, canvas.width * 0.17);
      const fontFamily = "'Rubik Spray Paint', sans-serif";
      ctx.font = `bold ${fontSize}px ${fontFamily}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // Draw the text in the center
      ctx.fillText("Reckless", canvas.width / 2, canvas.height / 2.8);
      ctx.fillText("Abandon", canvas.width / 2, canvas.height / 1.4);

      // 4. Set up the Eraser Mode
      // From here on, everything we draw "cuts holes" in what we just painted
      ctx.globalCompositeOperation = 'destination-out';
      ctx.globalAlpha = 1.0;
    }


    Promise.all([
      textureImg.decode(), // Ensures image is ready
      document.fonts.ready // Ensures all CSS fonts are ready
    ]).then(() => {
      initCtx();
    });
    window.addEventListener('resize', initCtx);

    // -- 3. Optimized Erasing Logic --
    let lastPoint = null;

    function erase(currX, currY) {
      if (!lastPoint) {
        lastPoint = { x: currX, y: currY };
        return;
      }

      // Calculate distance between points to fill gaps
      const dist = Math.hypot(currX - lastPoint.x, currY - lastPoint.y);
      const angle = Math.atan2(currX - lastPoint.x, currY - lastPoint.y);

      // Draw stamps along the line so there are no "dots" when moving fast
      for (let i = 0; i < dist; i += 5) { // Step every 5px
        const x = lastPoint.x + (Math.sin(angle) * i);
        const y = lastPoint.y + (Math.cos(angle) * i);

        // Create a radial gradient to act as a "soft brush"
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, ERASE_SIZE / 2);
        gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.8)'); // Center (erasing)
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');   // Edge (fading out)

        ctx.fillStyle = gradient;
        ctx.fillRect(x - ERASE_SIZE / 2, y - ERASE_SIZE / 2, ERASE_SIZE, ERASE_SIZE);
      }

      lastPoint = { x: currX, y: currY };
    }

    // -- 4. Interaction Logic --
    const scene = document.getElementById('scene');
    let rotX = -15, rotY = 30, startX, startY, isMouseDown = false;

    function rotateShelf(x, y) {
      rotY += (x - startX) * 0.4;
      rotX -= (y - startY) * 0.4;
      rotX = Math.max(-80, Math.min(80, rotX));
      scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      startX = x; startY = y;
    }

    // Throttling the move event can also help performance
    canvas.addEventListener('mousemove', (e) => {
      requestAnimationFrame(() => {
        erase(e.clientX, e.clientY);
      });
      if (isMouseDown) rotateShelf(e.clientX, e.clientY);
    });

    canvas.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      startX = e.clientX; startY = e.clientY;
      lastPoint = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      lastPoint = null;
    });

    // Touch Support
    canvas.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      lastPoint = { x: t.clientX, y: t.clientY };
    });

    canvas.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      erase(t.clientX, t.clientY);
    }, { passive: false });

    canvas.addEventListener('touchend', () => lastPoint = null);
  </script>

</body>

</html>
